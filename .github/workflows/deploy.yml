name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts   # skip onnxruntime-node's native download; the browser uses onnxruntime-web
      - name: Build site
        env:
          VITE_PUBLIC_BUCKET_URL: ${{ secrets.PUBLIC_BUCKET_URL }}
        run: |
          if [ -z "$VITE_PUBLIC_BUCKET_URL" ]; then
            echo "::error::Set the PUBLIC_BUCKET_URL Actions secret before deploying."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
